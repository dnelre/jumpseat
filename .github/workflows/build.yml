name: build

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; only the publish job may write packages
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On both architectures, so arm64 packages (Firefox, VS Code) are tested before anything is published
  build-arch:
    name: build (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      # Pinned to a commit, because a tag can be moved; Dependabot keeps it current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check jumpseat.py
        run: python3 -m py_compile scripts/jumpseat.py && python3 scripts/jumpseat.py --help
      - name: Check start scripts
        run: bash -n docker/start.sh && sh -n docker/start.d/*.sh docker/bwrap && bash -n scripts/ghcr-cleanup.sh
      - name: Build image
        run: docker compose -f docker/compose.yaml build
      # A green build does not mean the desktop works: start it and look for XFCE, Remmina and noVNC
      - name: Start the desktop
        run: scripts/smoke-test.sh jumpseat
      - name: Build image (dev)
        run: JUMPSEAT_TARGET=dev docker compose -f docker/compose.yaml build
      - name: Check the dev tools
        run: >-
          docker run --rm --entrypoint sh jumpseat -c 'code --version && gh --version && uv --version && git --version
          && python --version && node --version && npm --version && gcc --version && playwright-mcp --version'
      - name: Start the dev desktop
        run: scripts/smoke-test.sh jumpseat

  # The check that branch protection requires: green only when every architecture is
  build:
    needs: build-arch
    runs-on: ubuntu-24.04
    steps:
      - run: echo "All architectures built and passed the smoke test"

  # Images for amd64 and arm64 (e.g. a Raspberry Pi) to ghcr.io, only from main:
  #   ghcr.io/<owner>/jumpseat:latest  desktop target
  #   ghcr.io/<owner>/jumpseat:dev     dev target
  # Each architecture builds natively on its own runner and pushes <tag>-<arch>; the manifest job then joins them.
  # Plain docker commands: only GitHub's own actions are allowed in this repository.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [desktop, dev]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - target: desktop
            tag: latest
          - target: dev
            tag: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image=ghcr.io/${{ github.repository_owner }}/jumpseat
          # The docker-container driver can keep the build cache in the registry
          docker buildx create --use --name builder
          docker buildx build docker \
            --target "${{ matrix.target }}" \
            --platform "linux/${{ matrix.arch }}" \
            --cache-from "type=registry,ref=${image}:cache-${{ matrix.target }}-${{ matrix.arch }}" \
            --cache-to "type=registry,ref=${image}:cache-${{ matrix.target }}-${{ matrix.arch }},mode=max" \
            --tag "${image}:${{ matrix.tag }}-${{ matrix.arch }}" \
            --push

  manifest:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Also a fixed tag per publish (e.g. dev-20261116-e51627a): something to roll back to, and what the cleanup keeps
      - name: Join the architectures into one tag each
        run: |
          image=ghcr.io/${{ github.repository_owner }}/jumpseat
          stamp="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          for tag in latest dev; do
            docker buildx imagetools create --tag "${image}:${tag}" --tag "${image}:${tag}-${stamp}" \
              "${image}:${tag}-amd64" "${image}:${tag}-arm64"
          done

  # Old versions on ghcr.io: keeps every tag except fixed tags beyond the 3 newest per image, and everything the kept
  # tags point to (see scripts/ghcr-cleanup.sh). Dry run while CLEANUP_DELETE is "false": the log lists what would go.
  cleanup:
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      CLEANUP_DELETE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove old image versions
        run: |
          if [ "${CLEANUP_DELETE}" = true ]; then
            scripts/ghcr-cleanup.sh --delete
          else
            scripts/ghcr-cleanup.sh
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          KEEP: 3
