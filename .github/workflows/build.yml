name: build

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repository
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to a commit, because a tag can be moved; Dependabot keeps it current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check jumpseat.py
        run: |
          python3 scripts/jumpseat.py --help
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test PowerShell file runner
        run: |
          docker run --rm -v "$PWD:/workspace:ro" mcr.microsoft.com/powershell:7.4-ubuntu-22.04 \
            pwsh -NoLogo -NoProfile -File /workspace/scripts/test_powershell.ps1
      - name: Build image
        run: docker compose -f docker/compose.yaml build
      # A green build does not mean the desktop works: start it and look for XFCE, Remmina and noVNC
      - name: Start the desktop
        run: scripts/smoke-test.sh jumpseat
