name: build

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; only the publish job may write packages
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Pinned to a commit, because a tag can be moved; Dependabot keeps it current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check jumpseat.py
        run: python3 -m py_compile scripts/jumpseat.py && python3 scripts/jumpseat.py --help
      - name: Check start scripts
        run: bash -n docker/start.sh && sh -n docker/start.d/*.sh
      - name: Build image
        run: docker compose -f docker/compose.yaml build
      # A green build does not mean the desktop works: start it and look for XFCE, Remmina and noVNC
      - name: Start the desktop
        run: scripts/smoke-test.sh jumpseat
      - name: Build image (dev)
        run: JUMPSEAT_TARGET=dev docker compose -f docker/compose.yaml build
      - name: Check the dev tools
        run: docker run --rm --entrypoint sh jumpseat -c 'code --version && gh --version && uv --version && git --version'
      - name: Start the dev desktop
        run: scripts/smoke-test.sh jumpseat

  # Multi-arch images (amd64 + arm64, e.g. a Raspberry Pi) to ghcr.io, only from main:
  #   ghcr.io/<owner>/jumpseat:latest  desktop target
  #   ghcr.io/<owner>/jumpseat:dev     dev target
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # arm64 is built under QEMU emulation, which is slow
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: desktop
            tag: latest
          - target: dev
            tag: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jumpseat:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
