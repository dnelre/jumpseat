name: build

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; only the publish job may write packages
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Pinned to a commit, because a tag can be moved; Dependabot keeps it current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check jumpseat.py
        run: python3 -m py_compile scripts/jumpseat.py && python3 scripts/jumpseat.py --help
      - name: Check start scripts
        run: bash -n docker/start.sh && sh -n docker/start.d/*.sh
      - name: Build image
        run: docker compose -f docker/compose.yaml build
      # A green build does not mean the desktop works: start it and look for XFCE, Remmina and noVNC
      - name: Start the desktop
        run: scripts/smoke-test.sh jumpseat
      - name: Build image (dev)
        run: JUMPSEAT_TARGET=dev docker compose -f docker/compose.yaml build
      - name: Check the dev tools
        run: docker run --rm --entrypoint sh jumpseat -c 'code --version && gh --version && uv --version && git --version'
      - name: Start the dev desktop
        run: scripts/smoke-test.sh jumpseat

  # Multi-arch images (amd64 + arm64, e.g. a Raspberry Pi) to ghcr.io, only from main:
  #   ghcr.io/<owner>/jumpseat:latest  desktop target
  #   ghcr.io/<owner>/jumpseat:dev     dev target
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # arm64 is built under QEMU emulation, which is slow
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: desktop
            tag: latest
          - target: dev
            tag: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Plain docker commands: only GitHub's own actions are allowed in this repository
      - name: Set up arm64 emulation and buildx
        run: |
          docker run --rm --privileged tonistiigi/binfmt:qemu-v10.2.3 --install arm64
          docker buildx create --use --name multiarch
      - name: Log in to ghcr.io
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image=ghcr.io/${{ github.repository_owner }}/jumpseat
          docker buildx build docker \
            --target "${{ matrix.target }}" \
            --platform linux/amd64,linux/arm64 \
            --cache-from "type=registry,ref=${image}:cache-${{ matrix.target }}" \
            --cache-to "type=registry,ref=${image}:cache-${{ matrix.target }},mode=max" \
            --tag "${image}:${{ matrix.tag }}" \
            --push
