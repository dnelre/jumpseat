# Copy to compose.override.yaml (git-ignored) and replace the example values for your environment.
# jumpseat.py up loads it automatically.
services:
  jumpseat:
    # Lets short host names resolve, e.g. "server01" -> "server01.example.com"
    dns_search:
      - example.com
